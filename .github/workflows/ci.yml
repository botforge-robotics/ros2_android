name: CI Build & Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK & CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Make Gradle Wrapper Executable
        run: |
          cd rosdroid_app
          chmod +x gradlew

      - name: Run Unit Tests
        run: |
          cd rosdroid_app
          ./gradlew testDebugUnitTest --continue

      - name: Build Debug APK
        run: |
          cd rosdroid_app
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rosdroid-debug-apk
          path: rosdroid_app/app/build/outputs/apk/debug/*.apk
          retention-days: 14
